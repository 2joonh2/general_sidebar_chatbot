<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대전 서구 초등학교 ATTB 대시보드</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 24px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .control-box {
      background: white;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .dashboard-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    .school-name {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #1e40af;
    }

    .attb-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #555;
    }

    .attb-value {
      min-height: 120px;
      line-height: 1.8;
      font-size: 16px;
      white-space: pre-wrap;
      word-break: keep-all;
      background: #f9fafb;
      border-radius: 12px;
      padding: 20px;
    }

    .footer {
      margin-top: 20px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>대전 서구 초등학교 ATTB 대시보드</h1>

    <div class="controls">
      <div class="control-box">
        <label for="schoolSelect">학교 선택</label>
        <select id="schoolSelect"></select>
      </div>

      <div class="control-box">
        <label for="attbSelect">ATTB 선택</label>
        <select id="attbSelect"></select>
      </div>
    </div>

    <div class="dashboard-card">
      <div class="school-name" id="schoolName"></div>
      <div class="attb-title" id="attbTitle"></div>
      <div class="attb-value" id="attbValue"></div>
    </div>

    <div class="footer">
      전역 접근 가능 객체:
      <br />
      window.schoolData
      <br />
      window.selectedSchool
      <br />
      window.selectedAttb
      <br />
      window.updateDashboard()
    </div>
  </div>

  <script>
    // =============================
    // CSV 원본 데이터
    // =============================
    const rawCsv = `"학교명,교장 선생님,학생 수,교원 수,교훈,교목,교화,학교 홈페이지,교가(1절)"
"대전서원초등학교,오경운,606명,47명,착하고 튼튼하고 슬기로워라,소나무,개나리,https://dswes.djsch.kr/,아득한 선사 문화 살아숨쉰 곳 새롭게 눈을 떠서 슬기를 모아 저마다 꿈을 키워 굳세게 자라 조국을 번영시킬 큰 일꾼 되자"
"대전둔산초등학교,최미자,455명,41명,바르게 참되게 굳세게,소나무,장미,https://djds.djsch.kr/,둔지미 새 터전에 자리잡고서 사랑과 믿음으로 꽃피운 동산 마음껏 푸른 꿈을 키워나가며 나날이 튼튼하게 자라납니다"
"대전샘머리초등학교,이영석,770명,58명,바르고 슬기로우며 건강하게,소나무,장미,https://saemmeori.djsch.kr/,푸른 꿈 가득 안고서 새롭게 배우며 밝고 고운 마음으로 서로 돕고 사랑하자"
"대전월평초등학교,김용자,122명,19명,튼튼하고 바르며 지혜로운 어린이,은행나무,매화,https://djwpes.djsch.kr/,찬란한 문화의 빛 이어받아서 슬기론 배움터에 희망이 자란다"
"대전도안초등학교,김윤덕,1009명,68명,큰 꿈 깊은 생각 바른 행동,소나무,장미,https://djdoan.djsch.kr/,푸른 꿈 안고서 미래 향해 나아가자 아름다운 마음으로 서로 사랑하며"
"대전갑천초등학교,김미애,784명,56명,꿈과 사랑이 넘치는 행복한 학교,느티나무,철쭉,https://gapcheon.djsch.kr/,찬란한 미래 향하여 희망차게 자라나는 우리들은 갑천 어린이"`;

    // =============================
    // CSV 파싱
    // =============================
    function parseCsv(rawText) {
      const lines = rawText
        .trim()
        .split('\n')
        .map(line => line.replace(/^"|"$/g, ''));

      const headers = lines[0].split(',');

      const data = lines.slice(1).map(line => {
        const values = line.split(',');
        const obj = {};

        headers.forEach((header, idx) => {
          obj[header.trim()] = values[idx] ? values[idx].trim() : '';
        });

        return obj;
      });

      return {
        headers,
        data
      };
    }

    // =============================
    // 전역 데이터
    // =============================
    const parsed = parseCsv(rawCsv);

    window.schoolData = parsed.data;
    window.attbColumns = parsed.headers;

    window.selectedSchool = parsed.data[0]['학교명'];
    window.selectedAttb = parsed.headers[1];

    // =============================
    // DOM 요소
    // =============================
    const schoolSelect = document.getElementById('schoolSelect');
    const attbSelect = document.getElementById('attbSelect');

    const schoolNameEl = document.getElementById('schoolName');
    const attbTitleEl = document.getElementById('attbTitle');
    const attbValueEl = document.getElementById('attbValue');

    // =============================
    // 드롭다운 초기화
    // =============================
    function initializeDropdowns() {
      // 학교 목록
      window.schoolData.forEach(item => {
        const option = document.createElement('option');
        option.value = item['학교명'];
        option.textContent = item['학교명'];
        schoolSelect.appendChild(option);
      });

      // attb 목록
      window.attbColumns
        .filter(col => col !== '학교명')
        .forEach(col => {
          const option = document.createElement('option');
          option.value = col;
          option.textContent = col;
          attbSelect.appendChild(option);
        });

      schoolSelect.value = window.selectedSchool;
      attbSelect.value = window.selectedAttb;
    }

    // =============================
    // 대시보드 갱신 함수 (전역)
    // =============================
    window.updateDashboard = function (schoolName, attbName) {
      if (schoolName) {
        window.selectedSchool = schoolName;
        schoolSelect.value = schoolName;
      }
      if (attbName) {
        window.selectedAttb = attbName;
        attbSelect.value = attbName;
      }

      const school = window.schoolData.find(
        item => item['학교명'] === window.selectedSchool
      );

      if (!school) {
        schoolNameEl.textContent = '학교 정보를 찾을 수 없습니다.';
        attbTitleEl.textContent = '';
        attbValueEl.textContent = '';
        return JSON.stringify({ error: '학교 정보를 찾을 수 없습니다.' });
      }

      schoolNameEl.textContent = window.selectedSchool;
      attbTitleEl.textContent = window.selectedAttb;
      
      const resultValue = school[window.selectedAttb] || '-';
      attbValueEl.textContent = resultValue;
      
      // AI가 해석하기 쉬운 JSON 형식으로 반환
      return JSON.stringify({
        action: "updateDashboard",
        status: "success",
        schoolName: window.selectedSchool,
        attribute: window.selectedAttb,
        value: resultValue,
        message: `${window.selectedSchool}의 ${window.selectedAttb} 정보는 '${resultValue}' 입니다.`
      });
    };

    // =============================
    // 이벤트 등록
    // =============================
    schoolSelect.addEventListener('change', (e) => {
      window.updateDashboard(e.target.value, null);
    });

    attbSelect.addEventListener('change', (e) => {
      window.updateDashboard(null, e.target.value);
    });

    // =============================
    // 초기 실행
    // =============================
    initializeDropdowns();
    window.updateDashboard();
  </script>
</body>
</html>
